name: Subtitle regressions

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  subtitle-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-ass-plaintext-fallback.mjs
